<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Atik L. — AI Platform and Solutions Architect</title>
<desc id="desc">Enterprise delivery, technical leadership and critical systems, on a blue and violet gradient.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102645"/><stop offset=".6" stop-color="#174d77"/><stop offset="1" stop-color="#5945a1"/></linearGradient>
